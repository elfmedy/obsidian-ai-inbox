name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check tag and prepare assets
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if(JSON.parse(fs.readFileSync('manifest.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
          python3 scripts/package.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "AI Inbox $GITHUB_REF_NAME — Alpha" --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" dist/releases/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
