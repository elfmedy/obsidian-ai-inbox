<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Inbox · Settings</title><link rel="stylesheet" href="inbox.css"></head><body><main>
<div class="brand brand-lockup"><img src="icon-48.png" alt="" width="32" height="32">AI Inbox</div><h1 id="heading">聊天，归入你的笔记。</h1><p id="intro">选择一个运行中的 Obsidian 仓库。首次连接只需确认一次。</p>
<section class="destination"><span class="eyebrow" id="default-label">默认保存到</span><h2 id="current-vault">尚未选择</h2><p id="availability" class="secondary">首次选择后自动记住</p></section>
<div class="section-bar"><h2 id="available-label">可用仓库</h2><button id="refresh" class="quiet">刷新</button></div><div id="vault-list" aria-live="polite"></div><p id="result" role="status" aria-live="polite"></p>
<p id="hint">选择其他仓库后，它就成为默认。日常点击工具栏图标即可保存。</p><hr>
<label for="language" id="language-label">语言</label><select id="language"><option value="auto">跟随浏览器 / Automatic</option><option value="zh">简体中文</option><option value="en">English</option></select>
<label class="check"><input id="context" type="checkbox" checked><span id="context-label">在聊天页面右键菜单中显示保存</span></label>
<p class="secondary" id="shortcut-hint">请保持目标仓库打开。</p><a href="status.html" id="status-link">最近保存状态</a>
<script src="inbox-options.js"></script></main></body></html>
